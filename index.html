<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA PINHEIRO | VENDAS EMBARCAÇÕES</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg-body: #0a0a0c; --card-bg: #1c1c1e; --pinheiro-blue: #2b2d84; --pinheiro-orange: #f38218; --pinheiro-green: #22c55e; --text-main: #ffffff; --text-dim: #a1a1aa; --border: rgba(255, 255, 255, 0.1); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-body); color: var(--text-main); padding: 30px; }
        .container { max-width: 1400px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 30px; }
        .title-group h1 { font-size: 26px; font-weight: 800; letter-spacing: -1px; text-transform: uppercase; }
        .status-pills { display: flex; gap: 12px; margin-top: 15px; }
        .pill { background: var(--card-bg); padding: 8px 16px; border-radius: 50px; font-size: 11px; font-weight: 700; display: flex; align-items: center; gap: 8px; border: 1px solid var(--border); }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--pinheiro-green); box-shadow: 0 0 10px var(--pinheiro-green); }
        .loading-dot { background: var(--pinheiro-orange); animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
        .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card-kpi { background: var(--card-bg); padding: 25px; border-radius: 24px; border: 1px solid var(--border); position: relative; }
        .card-kpi::after { content: ''; position: absolute; bottom: 0; left: 20%; right: 20%; height: 3px; background: var(--pinheiro-blue); border-radius: 10px 10px 0 0; }
        .kpi-label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; font-weight: 700; letter-spacing: 1px; }
        .kpi-value { font-size: 24px; font-weight: 800; margin-top: 8px; display: block; }
        .charts-row { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 30px; }
        .chart-card { background: var(--card-bg); padding: 25px; border-radius: 24px; border: 1px solid var(--border); height: 350px; }
        .table-section { background: var(--card-bg); padding: 25px; border-radius: 24px; border: 1px solid var(--border); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th { text-align: left; padding: 15px; background: #111827; color: var(--text-dim); font-weight: 700; text-transform: uppercase; border: 1px solid var(--border); }
        td { padding: 12px 15px; border: 1px solid var(--border); }
        .val-bold { font-family: 'Courier New', monospace; font-weight: bold; text-align: right; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="title-group">
                <h1>Faturamento das Embarcações</h1>
                <div class="status-pills">
                    <div class="pill"><div id="status-dot" class="dot loading-dot"></div> <span id="status-text">Sincronizando...</span></div>
                    <div class="pill">🚢 LOGÍSTICA NAVAL</div>
                </div>
            </div>
            <img src="https://raw.githubusercontent.com/CamilaDS13/imagens/Principal/logobranca.png" style="height: 40px;">
        </header>

        <div class="metrics-grid">
            <div class="card-kpi"><span class="kpi-label">Faturamento Total</span><span id="v-total" class="kpi-value">R$ 0,00</span></div>
            <div class="card-kpi"><span class="kpi-label">Ticket Médio</span><span id="v-media" class="kpi-value">R$ 0,00</span></div>
            <div class="card-kpi"><span class="kpi-label">Melhor Mês</span><span id="v-mes" class="kpi-value">-</span></div>
            <div class="card-kpi"><span class="kpi-label">Notas Emitidas</span><span id="v-notas" class="kpi-value">0</span></div>
        </div>

        <div class="charts-row">
            <div class="chart-card"><canvas id="barChart"></canvas></div>
            <div class="chart-card"><canvas id="lineChart"></canvas></div>
        </div>

        <div class="table-section">
            <table id="mainTable">
                <thead>
                    <tr>
                        <th style="width:250px">Embarcação</th>
                        <th class="val-bold">JAN</th><th class="val-bold">FEV</th><th class="val-bold">MAR</th>
                        <th class="val-bold">ABR</th><th class="val-bold">MAI</th><th class="val-bold">JUN</th>
                        <th class="val-bold">JUL</th><th class="val-bold">AGO</th><th class="val-bold">TOTAL</th>
                    </tr>
                </thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>
    </div>

    <script>
        const SHEET_ID = '16E2_dadwyBxkx1432Qhpt3hhrEuBofvvf_92UHd1JkI';
        const URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=xlsx`;
        let rawData = [];
        let chartBar, chartLine;
        const mesesNomes = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto"];

        async function init() {
            try {
                const resp = await fetch(URL + "&t=" + new Date().getTime());
                const buff = await resp.arrayBuffer();
                const wb = XLSX.read(new Uint8Array(buff), {type:'array'});
                const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1});
                processar(rows);
                document.getElementById('status-dot').className = "dot";
                document.getElementById('status-text').innerText = "Dados Sincronizados";
            } catch(e) { document.getElementById('status-text').innerText = "Erro de Conexão"; }
        }

        function limpar(v) {
            if (!v) return 0;
            if (typeof v === 'number') return v;
            return parseFloat(v.toString().replace(/R\$/g, '').replace(/\s/g, '').replace(/\./g, '').replace(',', '.')) || 0;
        }

        function processar(rows) {
            rawData = rows.slice(1).filter(r => r[3] && r[6]).map(row => {
                let d = row[4], mIdx = -1;
                if (typeof d === 'number') mIdx = new Date((d - 25569) * 86400 * 1000).getMonth();
                else if (d) { let p = d.split('/'); if(p.length>=2) mIdx = parseInt(p[1])-1; }
                return { barco: row[3].toString().trim(), valor: limpar(row[6]), mesIdx: mIdx };
            });
            renderizar();
        }

        function renderizar() {
            let totalVal = 0; const matriz = {}; const totaisMes = Array(8).fill(0);
            rawData.forEach(n => {
                totalVal += n.valor;
                if (!matriz[n.barco]) matriz[n.barco] = Array(8).fill(0);
                if (n.mesIdx >= 0 && n.mesIdx < 8) { matriz[n.barco][n.mesIdx] += n.valor; totaisMes[n.mesIdx] += n.valor; }
            });
            const barcosOrd = Object.keys(matriz).sort((a, b) => matriz[b].reduce((x, y) => x + y, 0) - matriz[a].reduce((x, y) => x + y, 0));

            document.getElementById('v-total').innerText = totalVal.toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'});
            document.getElementById('v-notas').innerText = rawData.length;
            document.getElementById('v-media').innerText = (totalVal/rawData.length).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
            let maxM = Math.max(...totaisMes); document.getElementById('v-mes').innerText = mesesNomes[totaisMes.indexOf(maxM)];

            document.getElementById('table-body').innerHTML = barcosOrd.map(b => {
                let sB = matriz[b].reduce((x, y) => x + y, 0);
                return `<tr><td><strong>${b}</strong></td>` + matriz[b].map(v => `<td class="val-bold">${v > 0 ? 'R$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:2}) : '-'}</td>`).join('') + `<td class="val-bold" style="color:var(--pinheiro-green)">R$ ${sB.toLocaleString('pt-BR',{minimumFractionDigits:2})}</td></tr>`;
            }).join('') + `<tr style="background:#111827; font-weight:bold; color:var(--pinheiro-green)"><td>TOTAL MENSAL</td>${totaisMes.map(m => `<td class="val-bold">R$ ${m.toLocaleString('pt-BR',{minimumFractionDigits:2})}</td>`).join('')}<td class="val-bold">R$ ${totalVal.toLocaleString('pt-BR',{minimumFractionDigits:2})}</td></tr>`;

            if(chartBar) chartBar.destroy();
            chartBar = new Chart(document.getElementById('barChart'), { type: 'bar', data: { labels: barcosOrd, datasets: [{ label: 'Faturamento', data: barcosOrd.map(b => matriz[b].reduce((x,y)=>x+y,0)), backgroundColor: '#3b82f6' }] }, options: { responsive: true, maintainAspectRatio: false } });
            if(chartLine) chartLine.destroy();
            chartLine = new Chart(document.getElementById('lineChart'), { type: 'line', data: { labels: ["JAN","FEV","MAR","ABR","MAI","JUN","JUL","AGO"], datasets: [{ label: 'Evolução', data: totaisMes, borderColor: '#22c55e', backgroundColor: 'rgba(34, 197, 94, 0.1)', fill: true, tension: 0.3 }] }, options: { responsive: true, maintainAspectRatio: false } });
        }
        window.onload = init;
    </script>
</body>
</html>
