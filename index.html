<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA PINHEIRO | VENDAS EMBARCAÇÕES</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg-body: #0a0a0c; 
            --card-bg: #161b22; 
            --pinheiro-blue: #2b2d84; 
            --pinheiro-orange: #f38218; 
            --pinheiro-green: #22c55e; 
            --text-main: #ffffff; 
            --text-dim: #a1a1aa; 
            --border: rgba(255, 255, 255, 0.08); 
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        /* Preenchimento total da tela */
        body { 
            background-color: var(--bg-body); 
            color: var(--text-main); 
            padding: 25px 35px; 
            min-height: 100vh;
        }
        
        .container { 
            width: 100%; 
            max-width: 100%; 
            margin: 0 auto; 
        }

        header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 25px; 
        }

        .title-group h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; text-transform: uppercase; }
        .status-pills { display: flex; gap: 12px; margin-top: 10px; }
        .pill { background: var(--card-bg); padding: 7px 16px; border-radius: 50px; font-size: 11px; font-weight: 700; display: flex; align-items: center; gap: 8px; border: 1px solid var(--border); }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--pinheiro-green); box-shadow: 0 0 10px var(--pinheiro-green); }
        .loading-dot { background: var(--pinheiro-orange); animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        /* KPIs */
        .metrics-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); 
            gap: 20px; 
            margin-bottom: 25px; 
        }
        .card-kpi { 
            background: var(--card-bg); 
            padding: 22px 25px; 
            border-radius: 18px; 
            border: 1px solid var(--border); 
            position: relative; 
        }
        .card-kpi::after { content: ''; position: absolute; bottom: 0; left: 15%; right: 15%; height: 3px; background: var(--pinheiro-blue); border-radius: 10px 10px 0 0; }
        .kpi-label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; font-weight: 700; letter-spacing: 1px; }
        .kpi-value { font-size: 26px; font-weight: 800; margin-top: 8px; display: block; }

        /* Gráficos */
        .charts-row { 
            display: grid; 
            grid-template-columns: 2fr 1fr; 
            gap: 20px; 
            margin-bottom: 25px; 
        }
        .chart-card { 
            background: var(--card-bg); 
            padding: 22px; 
            border-radius: 18px; 
            border: 1px solid var(--border); 
            height: 340px; 
        }

        /* Seção da Tabela em Tela Cheia */
        .table-section { 
            background: var(--card-bg); 
            padding: 25px; 
            border-radius: 20px; 
            border: 1px solid var(--border); 
            overflow-x: auto; 
            width: 100%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        table { 
            width: 100%; 
            border-collapse: collapse; 
            font-size: 13px; 
            white-space: nowrap; /* Não quebra os valores */
        }

        th { 
            padding: 16px 14px; 
            background: #0d1117; 
            color: var(--text-dim); 
            font-weight: 800; 
            text-transform: uppercase; 
            border: 1px solid var(--border); 
            font-size: 11px;
            letter-spacing: 0.8px;
        }

        td { 
            padding: 14px 14px; 
            border: 1px solid var(--border); 
            vertical-align: middle;
        }

        /* Efeito de destaque ao passar o mouse */
        tbody tr { transition: background 0.15s ease; }
        tbody tr:hover { background-color: rgba(255, 255, 255, 0.04); }

        .barco-col {
            font-weight: 700;
            color: #f3f4f6;
            min-width: 220px;
        }

        .val-bold { 
            font-variant-numeric: tabular-nums; 
            font-weight: 600; 
            text-align: right; 
            white-space: nowrap; 
            padding-left: 12px;
            padding-right: 12px;
        }

        .val-empty {
            color: #4b5563;
            text-align: center;
        }

        @media (max-width: 1024px) {
            body { padding: 15px; }
            .charts-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="title-group">
                <h1>Faturamento das Embarcações</h1>
                <div class="status-pills">
                    <div class="pill"><div id="status-dot" class="dot loading-dot"></div> <span id="status-text">Sincronizando...</span></div>
                    <div class="pill">🚢 LOGÍSTICA NAVAL</div>
                </div>
            </div>
            <img src="https://raw.githubusercontent.com/CamilaDS13/imagens/Principal/logobranca.png" style="height: 38px;" onerror="this.style.display='none'">
        </header>

        <div class="metrics-grid">
            <div class="card-kpi"><span class="kpi-label">Faturamento Total</span><span id="v-total" class="kpi-value">R$ 0,00</span></div>
            <div class="card-kpi"><span class="kpi-label">Ticket Médio</span><span id="v-media" class="kpi-value">R$ 0,00</span></div>
            <div class="card-kpi"><span class="kpi-label">Melhor Mês</span><span id="v-mes" class="kpi-value">-</span></div>
            <div class="card-kpi"><span class="kpi-label">Notas Emitidas</span><span id="v-notas" class="kpi-value">0</span></div>
        </div>

        <div class="charts-row">
            <div class="chart-card"><canvas id="barChart"></canvas></div>
            <div class="chart-card"><canvas id="lineChart"></canvas></div>
        </div>

        <div class="table-section">
            <table id="mainTable">
                <thead id="table-head"></thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>
    </div>

    <script>
        const SHEET_ID = '16E2_dadwyBxkx1432Qhpt3hhrEuBofvvf_92UHd1JkI';
        const URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=xlsx`;
        let rawData = [];
        let chartBar, chartLine;
        
        const mesesNomes = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
        const mesesSiglas = ["JAN", "FEV", "MAR", "ABR", "MAI", "JUN", "JUL", "AGO", "SET", "OUT", "NOV", "DEZ"];

        async function init() {
            try {
                const resp = await fetch(URL + "&t=" + new Date().getTime());
                const buff = await resp.arrayBuffer();
                const wb = XLSX.read(new Uint8Array(buff), {type:'array'});
                const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1});
                processar(rows);
                document.getElementById('status-dot').className = "dot";
                document.getElementById('status-text').innerText = "Dados Sincronizados";
            } catch(e) { document.getElementById('status-text').innerText = "Erro de Conexão"; }
        }

        function limpar(v) {
            if (!v) return 0;
            if (typeof v === 'number') return v;
            return parseFloat(v.toString().replace(/R\$/g, '').replace(/\s/g, '').replace(/\./g, '').replace(',', '.')) || 0;
        }

        function processar(rows) {
            rawData = rows.slice(1).filter(r => r[3] && r[6]).map(row => {
                let d = row[4], mIdx = -1;
                if (typeof d === 'number') {
                    const dt = new Date((d - 25569 + 0.5) * 86400 * 1000);
                    mIdx = dt.getUTCMonth();
                } else if (d) { 
                    let p = d.toString().split(/[\/\-]/); 
                    if(p.length >= 2) mIdx = parseInt(p[1], 10) - 1; 
                }
                return { barco: row[3].toString().trim(), valor: limpar(row[6]), mesIdx: mIdx };
            });
            renderizar();
        }

        function renderizar() {
            if (!rawData.length) return;

            const maxMesFound = Math.max(...rawData.map(n => n.mesIdx).filter(m => m >= 0 && m < 12), 8);
            const numMeses = Math.min(12, maxMesFound + 1);

            const activeSiglas = mesesSiglas.slice(0, numMeses);
            let totalVal = 0; 
            const matriz = {}; 
            const totaisMes = Array(numMeses).fill(0);

            rawData.forEach(n => {
                totalVal += n.valor;
                if (!matriz[n.barco]) matriz[n.barco] = Array(numMeses).fill(0);
                if (n.mesIdx >= 0 && n.mesIdx < numMeses) { 
                    matriz[n.barco][n.mesIdx] += n.valor; 
                    totaisMes[n.mesIdx] += n.valor; 
                }
            });

            const barcosOrd = Object.keys(matriz).sort((a, b) => matriz[b].reduce((x, y) => x + y, 0) - matriz[a].reduce((x, y) => x + y, 0));

            // KPIs
            document.getElementById('v-total').innerText = totalVal.toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'});
            document.getElementById('v-notas').innerText = rawData.length.toLocaleString('pt-BR');
            document.getElementById('v-media').innerText = (totalVal / rawData.length).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
            
            let maxM = Math.max(...totaisMes); 
            document.getElementById('v-mes').innerText = mesesNomes[totaisMes.indexOf(maxM)];

            // Cabeçalho da Tabela
            document.getElementById('table-head').innerHTML = `
                <tr>
                    <th style="text-align: left; min-width: 220px;">Embarcação</th>
                    ${activeSiglas.map(s => `<th class="val-bold" style="text-align: right;">${s}</th>`).join('')}
                    <th class="val-bold" style="text-align: right; color: var(--pinheiro-green);">TOTAL</th>
                </tr>
            `;

            // Linhas da Tabela
            document.getElementById('table-body').innerHTML = barcosOrd.map(b => {
                let sB = matriz[b].reduce((x, y) => x + y, 0);
                return `<tr>
                    <td class="barco-col">${b}</td>
                    ${matriz[b].map(v => v > 0 
                        ? `<td class="val-bold">R$ ${v.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2})}</td>` 
                        : `<td class="val-empty">-</td>`
                    ).join('')}
                    <td class="val-bold" style="color:var(--pinheiro-green); font-weight:800;">R$ ${sB.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2})}</td>
                </tr>`;
            }).join('') + `
                <tr style="background:#0d1117; font-weight:800;">
                    <td style="color: var(--pinheiro-green); font-weight: 800;">TOTAL MENSAL</td>
                    ${totaisMes.map(m => `<td class="val-bold" style="color: var(--pinheiro-green); font-weight:800;">R$ ${m.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2})}</td>`).join('')}
                    <td class="val-bold" style="color: var(--pinheiro-green); font-size: 14px; font-weight:900;">R$ ${totalVal.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2})}</td>
                </tr>
            `;

            // Gráficos
            if(chartBar) chartBar.destroy();
            chartBar = new Chart(document.getElementById('barChart'), { 
                type: 'bar', 
                data: { 
                    labels: barcosOrd, 
                    datasets: [{ 
                        label: 'Faturamento', 
                        data: barcosOrd.map(b => matriz[b].reduce((x,y)=>x+y,0)), 
                        backgroundColor: '#3b82f6',
                        borderRadius: 6
                    }] 
                }, 
                options: { responsive: true, maintainAspectRatio: false } 
            });

            if(chartLine) chartLine.destroy();
            chartLine = new Chart(document.getElementById('lineChart'), { 
                type: 'line', 
                data: { 
                    labels: activeSiglas, 
                    datasets: [{ 
                        label: 'Evolução', 
                        data: totaisMes, 
                        borderColor: '#22c55e', 
                        backgroundColor: 'rgba(34, 197, 94, 0.1)', 
                        fill: true, 
                        tension: 0.35,
                        pointRadius: 4,
                        pointBackgroundColor: '#22c55e'
                    }] 
                }, 
                options: { responsive: true, maintainAspectRatio: false } 
            });
        }
        window.onload = init;
    </script>
</body>
</html>
